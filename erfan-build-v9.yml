          // ============================================================
          //  اسکن QR
          // ============================================================

          // ---- خواندن QR بدون ML Kit (ZXing خالص دارت) ----

          /// ورودی: [خاکستری، عرض، طول]؛ خروجی: متن QR یا null
          String? _zxDecode(List<Object> a) {
            final gray = a[0] as Uint8List;
            final w = a[1] as int;
            final h = a[2] as int;
            for (int pass = 0; pass < 2; pass++) {
              try {
                final px = Int32List(w * h);
                for (int i = 0; i < px.length; i++) {
                  final g = pass == 0 ? gray[i] : 255 - gray[i];
                  px[i] = 0xFF000000 | (g << 16) | (g << 8) | g;
                }
                final src = RGBLuminanceSource(w, h, px);
                final bmp = BinaryBitmap(GlobalHistogramBinarizer(src));
                final res = QRCodeReader().decode(bmp);
                final text = res.text;
                if (text.isNotEmpty) return text;
              } catch (_) {}
            }
            return null;
          }

          Future<String?> _decodeQrFromImage(Uint8List bytes) async {
            for (final width in const [1000, 640, 1600]) {
              try {
                final codec = await ui.instantiateImageCodec(bytes, targetWidth: width);
                final frame = await codec.getNextFrame();
                final im = frame.image;
                final data = await im.toByteData(format: ui.ImageByteFormat.rawRgba);
                final w = im.width, h = im.height;
                im.dispose();
                if (data == null) continue;
                final rgba = data.buffer.asUint8List();
                final gray = Uint8List(w * h);
                for (int i = 0; i < gray.length; i++) {
                  final o = i * 4;
                  gray[i] = (rgba[o] * 299 + rgba[o + 1] * 587 + rgba[o + 2] * 114) ~/ 1000;
                }
                final r = await compute(_zxDecode, <Object>[gray, w, h]);
                if (r != null) return r;
              } catch (_) {}
            }
            return null;
          }

          class QrScanPage extends StatefulWidget {
            const QrScanPage({super.key});

            @override
            State<QrScanPage> createState() => _QrScanPageState();
          }

          class _QrScanPageState extends State<QrScanPage> with WidgetsBindingObserver {
            CameraController? _cc;
            PermissionStatus? _perm;
            String _camError = '';
            bool _done = false;
            bool _torch = false;
            bool _asking = false;
            bool _busy = false;
            bool _starting = false;
            DateTime _lastTry = DateTime.fromMillisecondsSinceEpoch(0);

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _ask();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _stopCamera();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed && _perm != PermissionStatus.granted) {
                _check();
              }
            }

            Future<void> _check() async {
              try {
                final s = await Permission.camera.status;
                if (s.isGranted && mounted) {
                  setState(() => _perm = s);
                  _startCamera();
                }
              } catch (_) {}
            }

            Future<void> _ask() async {
              if (_asking) return;
              _asking = true;
              try {
                var s = await Permission.camera.status;
                if (!s.isGranted) s = await Permission.camera.request();
                if (!mounted) return;
                setState(() => _perm = s);
                if (s.isGranted) _startCamera();
              } catch (_) {
                if (mounted) setState(() => _perm = PermissionStatus.denied);
              } finally {
                _asking = false;
              }
            }

            Future<void> _stopCamera() async {
              final c = _cc;
              _cc = null;
              if (c == null) return;
              try {
                if (c.value.isStreamingImages) await c.stopImageStream();
              } catch (_) {}
              try {
                await c.dispose();
              } catch (_) {}
            }

            Future<void> _startCamera() async {
              if (_starting || _cc != null) return;
              _starting = true;
              try {
                final cams = await availableCameras();
                if (cams.isEmpty) throw 'no camera';
                final cam = cams.firstWhere(
                    (c) => c.lensDirection == CameraLensDirection.back,
                    orElse: () => cams.first);
                final c = CameraController(cam, ResolutionPreset.medium,
                    enableAudio: false, imageFormatGroup: ImageFormatGroup.yuv420);
                await c.initialize();
                if (!mounted) {
                  await c.dispose();
                  return;
                }
                _cc = c;
                _camError = '';
                await c.startImageStream(_onFrame);
                if (mounted) setState(() {});
              } catch (e) {
                _camError = e.toString();
                await _stopCamera();
                if (mounted) setState(() {});
              } finally {
                _starting = false;
              }
            }

            void _onFrame(CameraImage img) {
              if (_busy || _done) return;
              final now = DateTime.now();
              if (now.difference(_lastTry).inMilliseconds < 400) return;
              _lastTry = now;
              _busy = true;
              try {
                final w = img.width, h = img.height;
                final plane = img.planes[0];
                final stride = plane.bytesPerRow;
                final src = plane.bytes;
                final gray = Uint8List(w * h);
                for (int y = 0; y < h; y++) {
                  final so = y * stride, d = y * w;
                  gray.setRange(d, d + w, src, so);
                }
                compute(_zxDecode, <Object>[gray, w, h]).then((r) {
                  _busy = false;
                  if (r != null) _finish(r);
                }).catchError((_) {
                  _busy = false;
                });
              } catch (_) {
                _busy = false;
              }
            }

            void _finish(String v) {
              if (_done || !mounted) return;
              _done = true;
              Navigator.of(context).pop(v);
            }

            void _msg(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(m)));
            }

            /// عکس QR از گالری، یا عکس گرفتن با برنامه‌ی دوربین خود گوشی
            Future<void> _pickImage({bool camera = false}) async {
              try {
                final x = await ImagePicker().pickImage(
                    source: camera ? ImageSource.camera : ImageSource.gallery);
                if (x == null) return;
                _msg(tr('در حال خواندن QR...', 'Reading the QR...'));
                final bytes = await x.readAsBytes();
                final text = await _decodeQrFromImage(bytes);
                if (text != null) {
                  _finish(text);
                } else {
                  _msg(tr('تو این عکس QR پیدا نشد', 'No QR code found in this image'));
                }
              } catch (e) {
                _msg(tr('خواندن عکس ناموفق بود: $e', 'Could not read the image: $e'));
              }
            }

            Widget _bigButton(IconData icon, String label, VoidCallback onTap,
                {bool primary = true}) {
              return Padding(
                padding: const EdgeInsets.only(top: 12),
                child: SizedBox(
                  width: double.infinity,
                  child: primary
                      ? FilledButton.icon(
                          onPressed: onTap,
                          style: FilledButton.styleFrom(
                            minimumSize: const Size.fromHeight(52),
                            backgroundColor: cBlue,
                            foregroundColor: Colors.white,
                          ),
                          icon: Icon(icon),
                          label: Text(label, style: const TextStyle(fontSize: 16)),
                        )
                      : OutlinedButton.icon(
                          onPressed: onTap,
                          style: OutlinedButton.styleFrom(
                            minimumSize: const Size.fromHeight(52),
                            foregroundColor: Colors.white,
                            side: BorderSide(color: cLine, width: 1.5),
                          ),
                          icon: Icon(icon),
                          label: Text(label, style: const TextStyle(fontSize: 16)),
                        ),
                ),
              );
            }

            Widget _problem(String title, String detail,
                {bool permanent = false, VoidCallback? retry}) {
              return Center(
                child: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Icon(Icons.no_photography, size: 56, color: Colors.white70),
                      const SizedBox(height: 14),
                      Text(title,
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 18)),
                      const SizedBox(height: 8),
                      Text(detail,
                          textAlign: TextAlign.center,
                          textDirection: TextDirection.ltr,
                          style: const TextStyle(color: Colors.white70)),
                      const SizedBox(height: 10),
                      if (permanent)
                        _bigButton(Icons.settings,
                            tr('باز کردن تنظیمات برنامه', 'Open app settings'), () => openAppSettings())
                      else
                        _bigButton(Icons.videocam, tr('دادن مجوز دوربین', 'Allow camera'),
                            retry ?? _ask),
                      _bigButton(Icons.photo_camera,
                          tr('گرفتن عکس با برنامه‌ی دوربین', 'Take a photo with the camera app'),
                          () => _pickImage(camera: true),
                          primary: false),
                      _bigButton(Icons.photo_library, tr('انتخاب از گالری', 'Pick from gallery'),
                          () => _pickImage(),
                          primary: false),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final c = _cc;
              final live = c != null && c.value.isInitialized;
              Widget body;
              if (_perm == null) {
                body = const Center(child: CircularProgressIndicator());
              } else if (!_perm!.isGranted) {
                final permanent = _perm == PermissionStatus.permanentlyDenied ||
                    _perm == PermissionStatus.restricted;
                body = _problem(
                  tr('برای اسکن QR مجوز دوربین لازمه', 'Camera permission is needed to scan QR'),
                  permanent
                      ? tr('مجوز دوربین بسته شده. از تنظیمات برنامه، مجوز دوربین رو روشن کن.',
                          'Camera permission is blocked. Turn it on in the app settings.')
                      : tr('روی «دادن مجوز دوربین» بزن و اجازه بده.',
                          'Tap “Allow camera” and grant access.'),
                  permanent: permanent,
                );
              } else if (_camError.isNotEmpty) {
                body = _problem(
                  tr('دوربین باز نشد', 'The camera could not start'),
                  _camError,
                  retry: () {
                    setState(() => _camError = '');
                    _startCamera();
                  },
                );
              } else if (!live) {
                body = const Center(child: CircularProgressIndicator());
              } else {
                body = Stack(
                  children: [
                    Center(child: CameraPreview(c)),
                    IgnorePointer(
                      child: Align(
                        alignment: const Alignment(0, -0.2),
                        child: Container(
                          width: 250,
                          height: 250,
                          decoration: BoxDecoration(
                            border: Border.all(color: Colors.white, width: 3),
                            borderRadius: BorderRadius.circular(20),
                          ),
                        ),
                      ),
                    ),
                    Positioned(
                      left: 24,
                      right: 24,
                      bottom: 36,
                      child: SafeArea(
                        child: FilledButton.icon(
                          onPressed: () => _pickImage(),
                          style: FilledButton.styleFrom(
                            minimumSize: const Size.fromHeight(54),
                            backgroundColor: cBlue,
                            foregroundColor: Colors.white,
                          ),
                          icon: const Icon(Icons.photo_library),
                          label: Text(tr('افزودن از گالری', 'Add from gallery'),
                              style: const TextStyle(fontSize: 17)),
                        ),
                      ),
                    ),
                  ],
                );
              }
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  title: Text(tr('اسکن QR', 'Scan QR')),
                  actions: [
                    if (live)
                      IconButton(
                        tooltip: tr('چراغ قوه', 'Torch'),
                        icon: Icon(_torch ? Icons.flash_on : Icons.flash_off),
                        onPressed: () async {
                          try {
                            await c.setFlashMode(_torch ? FlashMode.off : FlashMode.torch);
                            setState(() => _torch = !_torch);
                          } catch (_) {}
                        },
                      ),
                    IconButton(
                      tooltip: tr('عکس از گالری', 'Image from gallery'),
                      icon: const Icon(Icons.image),
                      onPressed: () => _pickImage(),
                    ),
                  ],
                ),
                body: body,
              );
            }
          }
          DART_EOF
          cat > app/pubspec.yaml <<'PUB_EOF'
          name: erfan
          description: ERFAN VPN - VPN config client.
          publish_to: "none"
          version: 4.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_v2ray: ^1.0.10
            shared_preferences: ^2.2.2
            http: ^1.2.0
            image_picker: ^1.0.8
            path_provider: ^2.1.2
            permission_handler: ^11.3.1
            camera: ^0.12.0
            zxing2: ^0.2.3

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUB_EOF

      - name: Patch Android settings
        working-directory: app/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ERFAN VPN"/' $M
          python3 - <<'PY'
          import re
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          for perm in ['INTERNET', 'CAMERA']:
              if 'android.permission.' + perm not in s:
                  s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.' + perm + '"/>', s, count=1)
          if 'hasFragileUserData' not in s:
              s = s.replace('<application', '<application android:hasFragileUserData="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          for G in app/build.gradle.kts app/build.gradle; do
            if [ -f "$G" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$G"
              if [ "$G" = "app/build.gradle.kts" ]; then
                sed -i '0,/^android {/s//android {\n    packaging { jniLibs { useLegacyPackaging = true } }/' "$G"
              else
                sed -i '0,/^android {/s//android {\n    packagingOptions { jniLibs { useLegacyPackaging = true } }/' "$G"
              fi
            fi
          done
          cat $M

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: ERFAN-apk
          path: app/build/app/outputs/flutter-apk/*.apk
