                ..sort(_cmpBest);
              final shown = top.take(5).toList();
              return ListView(
                padding: const EdgeInsets.fromLTRB(16, 8, 16, 24),
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(6, 10, 6, 10),
                    child: Text(tr('آمار', 'Statistics'),
                        style: const TextStyle(fontSize: 32, fontWeight: FontWeight.w600)),
                  ),
                  _pageCard([
                    _statRow(tr('وضعیت', 'Status'),
                        _connected ? tr('متصل', 'Connected') : tr('قطع', 'Disconnected')),
                    const Divider(height: 1),
                    _statRow(tr('مدت اتصال', 'Duration'), _connected ? _status.duration : '—'),
                    const Divider(height: 1),
                    _statRow(tr('سرور', 'Server'), sel == null ? '—' : _nameOf(sel)),
                  ]),
                  _pageCard([
                    _statRow(tr('سرعت دانلود', 'Download speed'), '${_dlMbps.toStringAsFixed(1)} Mbps'),
                    const Divider(height: 1),
                    _statRow(tr('سرعت آپلود', 'Upload speed'), '${_ulMbps.toStringAsFixed(1)} Mbps'),
                    const Divider(height: 1),
                    _statRow(tr('بیشترین سرعت دانلود', 'Peak download'), '${_peakDl.toStringAsFixed(1)} Mbps'),
                    const Divider(height: 1),
                    _statRow(tr('پینگ زنده', 'Live ping'),
                        _connected && _livePing > 0 ? '$_livePing ms' : '—'),
                  ]),
                  _pageCard([
                    _statRow(tr('حجم دانلود (این اتصال)', 'Downloaded (this session)'),
                        _fmt(_connected ? _status.download : 0)),
                    const Divider(height: 1),
                    _statRow(tr('حجم آپلود (این اتصال)', 'Uploaded (this session)'),
                        _fmt(_connected ? _status.upload : 0)),
                  ]),
                  _sec(tr('سریع‌ترین سرورها', 'Fastest servers')),
                  if (shown.isEmpty)
                    _pageCard([
                      Padding(
                        padding: const EdgeInsets.all(20),
                        child: Text(tr('هنوز نتیجه‌ای نیست. «بررسی پینگ» رو بزن.',
