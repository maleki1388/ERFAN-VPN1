            Widget _homeTab() {
              final color = _connected
                  ? cCyan
                  : _connecting
                      ? Colors.orangeAccent
                      : cIdle;
              final sel = _byLink(_selected);
              final selPing = sel == null ? null : _pings[sel.link];
              final selSpeed = sel == null ? null : _speeds[sel.link];

              final baseLink = _connected ? (_activeLink ?? _selected) : _selected;
              String shown(double live, double? last) {
                if (live > 0.05) return live.toStringAsFixed(1);
                if (last != null && last > 0) return last.toStringAsFixed(1);
                return '0.0';
              }
              final dlTxt = shown(_dlMbps, baseLink == null ? null : _speeds[baseLink]);
              // آپلود با کیلوبایت بر ثانیه شروع می‌شه و از ۱ مگابایت بر ثانیه به بالا مگابایت می‌شه
              double ulMbps = _ulMbps;
              if (ulMbps <= 0.0005 && baseLink != null && _ups[baseLink] != null) {
                ulMbps = _ups[baseLink]!;
              }
              final ulBytes = ulMbps * 1e6 / 8;
              String ulTxt;
              String ulUnit;
              if (ulBytes >= 1024 * 1024) {
                ulTxt = (ulBytes / 1024 / 1024).toStringAsFixed(1);
                ulUnit = 'MB/s';
              } else {
                ulTxt = (ulBytes / 1024).toStringAsFixed(ulBytes >= 10 * 1024 ? 0 : 1);
                ulUnit = 'KB/s';
              }
              String pingTxt = '—';
              if (_connected && _livePing > 0) {
                pingTxt = '$_livePing';
              } else if (!_connected && selPing != null && selPing > 0) {
                pingTxt = '$selPing';
              }
              final pingHist = _pingHist.isNotEmpty
                  ? _pingHist
                  : (selPing != null && selPing > 0 ? <double>[selPing.toDouble(), selPing.toDouble()] : <double>[]);

              final label = _connected
                  ? tr('متصل است', 'Connected')
                  : _connecting
                      ? tr('در حال اتصال...', 'Connecting...')
                      : tr('متصل نیست', 'Not connected');
              final dot = _connected
                  ? cGreen
                  : _connecting
                      ? Colors.orangeAccent
                      : Colors.white38;

              return ListView(
                padding: const EdgeInsets.fromLTRB(16, 6, 16, 16),
                children: [
                  Row(
                    children: [
                      IconButton(
                        tooltip: tr('تغییر زبان', 'Language'),
                        onPressed: _toggleLang,
                        icon: Icon(Icons.translate, color: cBlue, size: 28),
                      ),
                      Expanded(
                        child: Center(
                          child: Row(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Icon(Icons.public, color: cBlue, size: 26),
                              const SizedBox(width: 8),
                              Text(tr('اتصال امن', 'Secure connection'),
                                  style: const TextStyle(fontSize: 15, color: Colors.white70)),
                              const SizedBox(width: 6),
