          class SparkPainter extends CustomPainter {
            final List<double> v;
            final Color color;
            SparkPainter(this.v, this.color);

            @override
            void paint(Canvas canvas, Size s) {
              final n = v.length;
              double maxV = 1e-6;
              for (final x in v) {
                if (x > maxV) maxV = x;
              }
              final pts = <Offset>[];
              if (n < 2) {
                pts.add(Offset(0, s.height * 0.65));
                pts.add(Offset(s.width, s.height * 0.65));
              } else {
                for (int i = 0; i < n; i++) {
                  final x = s.width * i / (n - 1);
                  final y = s.height - (v[i] / maxV) * s.height * 0.7 - s.height * 0.12;
                  pts.add(Offset(x, y));
                }
              }
              final path = Path()..moveTo(pts.first.dx, pts.first.dy);
              for (int i = 1; i < pts.length; i++) {
                final mid = Offset((pts[i - 1].dx + pts[i].dx) / 2, (pts[i - 1].dy + pts[i].dy) / 2);
                path.quadraticBezierTo(pts[i - 1].dx, pts[i - 1].dy, mid.dx, mid.dy);
              }
              path.lineTo(pts.last.dx, pts.last.dy);

              final fill = Path.from(path)
                ..lineTo(s.width, s.height)
                ..lineTo(0, s.height)
                ..close();
              canvas.drawPath(
                fill,
                Paint()
                  ..shader = LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [color.withOpacity(0.35), color.withOpacity(0.0)],
                  ).createShader(Offset.zero & s),
              );
              canvas.drawPath(
                path,
                Paint()
                  ..color = color
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 2.2
                  ..strokeCap = StrokeCap.round,
              );
            }

            @override
            bool shouldRepaint(covariant SparkPainter old) => true;
          }


