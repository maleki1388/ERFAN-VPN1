            Widget _groupCard(CfgGroup g) {
              final key = g.sub ?? '';
              final collapsed = _collapsed.contains(key);
              final info = g.sub == null ? null : _subInfo[g.sub!];
              final hasUsage = info != null && info.total > 0;
              final days = info == null ? null : _daysLeft(info.expire);
              final updating = g.sub != null && _busyUpd.contains(g.sub!);

              return Directionality(
                textDirection: TextDirection.ltr,
                child: Container(
                  margin: const EdgeInsets.fromLTRB(12, 6, 12, 6),
                  padding: const EdgeInsets.fromLTRB(4, 8, 4, 10),
                  decoration: BoxDecoration(
                    color: cCardA,
                    borderRadius: BorderRadius.circular(24),
                  ),
                  child: Column(
                    children: [
                      Row(
                        children: [
                          IconButton(
                            onPressed: () => _toggleGroup(key),
                            icon: Icon(
                                collapsed
                                    ? Icons.keyboard_arrow_right
                                    : Icons.keyboard_arrow_down,
                                color: cAccent),
                          ),
                          Expanded(
                            child: Text(
                              '${g.title} (${g.items.length})',
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(
                                  fontSize: 20, fontWeight: FontWeight.w500),
                            ),
                          ),
                          IconButton(
                            tooltip: tr('پینگ گروه', 'Ping group'),
                            onPressed: () => _pingConfigs(g.items),
                            icon: Icon(Icons.speed, color: cAccent),
                          ),
                          PopupMenuButton<String>(
                            onSelected: (v) {
                              if (v == 'upd' && g.sub != null) _updateOneSub(g.sub!);
                              if (v == 'copy' && g.sub != null) {
                                Clipboard.setData(ClipboardData(text: g.sub!));
                                _toast(tr('لینک کپی شد', 'Link copied'));
                              }
                              if (v == 'del') {
                                if (g.sub != null) {
                                  _removeSub(g.sub!);
                                } else {
                                  _clearLocal();
                                }
                              }
                            },
                            itemBuilder: (_) => [
                              if (g.sub != null)
                                PopupMenuItem(
                                    value: 'upd', child: Text(tr('آپدیت', 'Update'))),
                              if (g.sub != null)
                                PopupMenuItem(
                                    value: 'copy',
                                    child: Text(tr('کپی لینک ساب', 'Copy subscription link'))),
                              PopupMenuItem(
                                  value: 'del',
                                  child: Text(g.sub != null
                                      ? tr('حذف ساب', 'Delete subscription')
                                      : tr('حذف همه', 'Delete all'))),
                            ],
                          ),
                        ],
                      ),
                      if (g.sub != null)
                        Padding(
                          padding: const EdgeInsets.fromLTRB(12, 2, 12, 0),
                          child: Row(
                            children: [
                              FilledButton.tonalIcon(
                                onPressed: updating ? null : () => _updateOneSub(g.sub!),
                                icon: updating
                                    ? const SizedBox(
                                        width: 16,
                                        height: 16,
                                        child: CircularProgressIndicator(strokeWidth: 2))
                                    : const Icon(Icons.sync, size: 18),
                                label: Text(tr('آپدیت', 'Update')),
                                style: FilledButton.styleFrom(
                                  visualDensity: VisualDensity.compact,
                                  padding: const EdgeInsets.symmetric(horizontal: 14),
                                ),
                              ),
                              const SizedBox(width: 12),
                              Expanded(
                                child: hasUsage
                                    ? Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          LinearProgressIndicator(
                                            value: (info!.used / info!.total)
                                                .clamp(0.0, 1.0)
                                                .toDouble(),
                                            minHeight: 6,
                                            borderRadius: BorderRadius.circular(3),
                                          ),
                                          const SizedBox(height: 4),
                                          Row(
                                            mainAxisAlignment:
                                                MainAxisAlignment.spaceBetween,
                                            children: [
                                              Text(
                                                  '${_gb(info!.used)} / ${_gb(info!.total)}',
                                                  style: const TextStyle(
                                                      fontSize: 12,
                                                      color: Colors.white70)),
                                              if (days != null)
                                                Text(
                                                    days > 0
                                                        ? tr('$days روز باقی‌مانده',
                                                            '$days days left')
                                                        : tr('منقضی شد', 'Expired'),
                                                    style: const TextStyle(
                                                        fontSize: 12,
                                                        color: Colors.white70)),
                                            ],
                                          ),
                                        ],
                                      )
                                    : const SizedBox.shrink(),
                              ),
                            ],
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }

            Widget _pingBadge(int p) {
              final bad = p < 0;
