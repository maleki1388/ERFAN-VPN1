            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: cBg0,
                appBar: AppBar(title: Text(tr('تست سرعت', 'Speed test'))),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      Row(
                        children: [
                          _metric(tr('پینگ', 'Ping'), _ping == null ? '—' : '$_ping ms'),
                          _metric(tr('دانلود', 'Download'),
                              _down == null ? '—' : '${_down!.toStringAsFixed(1)} Mbps'),
                          _metric(tr('آپلود', 'Upload'),
                              _up == null ? '—' : '${_up!.toStringAsFixed(1)} Mbps'),
                        ],
                      ),
                      const SizedBox(height: 24),
                      if (_running) Text(_phase),
                      if (_err != null)
                        Padding(
                          padding: const EdgeInsets.only(top: 8),
                          child: Text(_err!, style: const TextStyle(color: Colors.redAccent)),
                        ),
                      const SizedBox(height: 16),
                      SizedBox(
                        width: 200,
                        height: 50,
                        child: FilledButton(
                          onPressed: _running ? null : _run,
                          child: Text(tr('شروع تست', 'Start test')),
                        ),
                      ),
                      const Spacer(),
                      Text(
                        tr('برای تست سرعت خود VPN، اول وصل شو و بعد تست رو بزن.',
                            'To test the VPN speed, connect first and then run the test.'),
                        textAlign: TextAlign.center,
