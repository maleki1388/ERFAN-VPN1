            // امتیاز ترکیبی سرعت و پینگ؛ هرچی بیشتر بهتر
            double _score(Cfg c) {
              final p = _pings[c.link];
              final s = _speeds[c.link];
              if (p == null || p <= 0 || s == null) return -1;
              return s / (1 + p / 150.0);
            }

            int _cmpBest(Cfg a, Cfg b) {
              final sa = _speeds[a.link];
              final sb = _speeds[b.link];
              if (sa != null && sb == null) return -1;
              if (sa == null && sb != null) return 1;
              if (sa != null && sb != null) {
                final d = _score(b).compareTo(_score(a));
                if (d != 0) return d;
              }
              return _pings[a.link]!.compareTo(_pings[b.link]!);
            }

            // ---------- UI اصلی ----------

            String _fmt(int b) {
              if (b < 1024) return '$b B';
              if (b < 1024 * 1024) return '${(b / 1024).toStringAsFixed(1)} KB';
              if (b < 1024 * 1024 * 1024) return '${(b / 1024 / 1024).toStringAsFixed(1)} MB';
              return '${(b / 1024 / 1024 / 1024).toStringAsFixed(2)} GB';
            }

